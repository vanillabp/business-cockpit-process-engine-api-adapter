name: Build
# A pull request builds and tests. Publishing is the job of
# publish-snapshots.yaml, which has a concurrency group of its own.
"on":
  pull_request:
  workflow_dispatch:
  # The nightly build calls this workflow as it is, so the night proves what a pull request
  # proves. See nightly-build.yaml.
  workflow_call:
# Where Maven reads the snapshots of the other VanillaBP repositories from, see
# .github/maven/settings.xml: from GitHub Packages once the organization sets the Actions
# variable VANILLABP_SNAPSHOTS_FROM to 'github-packages', else from the snapshot repository of
# Maven Central. Reading GitHub Packages needs a token even for public packages. The
# GITHUB_TOKEN of the run is enough, because every job which runs Maven asks for
# 'packages: read'.
env:
  VBP_SNAPSHOTS_FROM: "${{ vars.VANILLABP_SNAPSHOTS_FROM == 'github-packages' && 'github-packages' || 'central' }}"
  VBP_PACKAGES_READ_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
concurrency:
  # A group per pull request. GitHub keeps at most one waiting run per group, and a
  # newer run takes the place of the one that waits. The replaced run ends as
  # 'cancelled' without ever starting a job, so its pull request is left with no build
  # result, and nothing in the interface says that a result is missing.
  # 'cancel-in-progress: false' only protects the run which is already running.
  #
  # With the ref in the group name, a build waits only for another build of the same
  # pull request, and there the newest commit keeps its run. Sharing the group with the
  # publish workflow was never needed for this build: it runs 'install' and uploads
  # nothing, so it can neither overwrite a snapshot nor be overwritten by one.
  group: business-cockpit-process-engine-api-adapter-pr-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      # the Maven the publish of main runs with, see publish-snapshots.yaml for why it is not
      # the 3.10 of the runner image
      - name: Use Maven 3.9
        run: |
          # Into a file and not through a pipe: a transfer which breaks halfway has already
          # written to tar, so a repeat of curl could not mend it. Nine repeats wait about
          # eight minutes, long enough for a 429 of Central to pass.
          curl -fsSL --retry 9 --retry-all-errors --retry-max-time 600 --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/apache-maven.tar.gz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          tar xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
      # 'install' and not 'install verify': install already runs every phase verify has,
      # so naming both makes Maven walk two lifecycles per module. The tests skip their
      # second run, the compiler does not, and every javac warning is reported twice. It
      # stays 'install' because the Quarkus tests load modules from the local repository.
      - name: Build and test
        # The snapshots this build reads, of the platform, of the Process-Engine-API adapter and
        # of the cockpit, come from the snapshot repository of Maven Central, without a login.
        # So the build needs no secret, and a pull request from a fork builds like any other.
        run: mvn -s .github/maven/settings.xml --batch-mode --no-transfer-progress --update-snapshots install
      # what a failing test printed is in these reports, and for a test booting its
      # application in a forked JVM it is ONLY in that application's own log file
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
