name: Publish snapshots
# Only a push to main publishes the snapshot. Other repositories compile against the
# shared snapshot coordinates, so what gets published has to be what main holds, not
# whatever branch was pushed last.
#
# The snapshots go to two places in one build, with the profile 'publish-snapshots' of the
# POM. GitHub Packages is what the builds of the other VanillaBP repositories read, so they
# do not ask Maven Central for every snapshot and are not stopped by its rate limit. The
# snapshot repository of Maven Central stays for everybody else: anybody can read it there
# without a login. Writing needs the Central Portal token, and only this workflow and the
# release get it.
#
# Only where the Actions variable VANILLABP_PUBLISH is 'true' does this workflow publish.
# The vanillabp organization sets it for all its repositories. A fork does not have it, so
# a fork never publishes.
"on":
  push:
    branches:
      - "main"
# Where Maven reads the snapshots of the other VanillaBP repositories from, see
# .github/maven/settings.xml: from GitHub Packages once the organization sets the Actions
# variable VANILLABP_SNAPSHOTS_FROM to 'github-packages', else from the snapshot repository of
# Maven Central. Reading GitHub Packages needs a token even for public packages. The
# GITHUB_TOKEN of the run is enough, because every job which runs Maven asks for
# 'packages: read'.
env:
  VBP_SNAPSHOTS_FROM: "${{ vars.VANILLABP_SNAPSHOTS_FROM == 'github-packages' && 'github-packages' || 'central' }}"
  VBP_PACKAGES_READ_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
concurrency:
  # One publish of this repository at a time, because snapshot artifacts share their
  # coordinates and two publishes at once overwrite each other. A run which is already
  # running is never cancelled. A run which is only waiting can be taken out by a newer
  # one, because GitHub keeps at most one waiting run per group, and for a publish of
  # main that is what should happen: the newer run carries the newer artifacts. The
  # pull-request build has a group of its own, one per pull request, because it
  # publishes nothing. The release has a group of its own too, so it can run beside a
  # publish: both upload to Maven Central, but a release writes fixed
  # versions and this workflow writes the snapshot, so they never write the same
  # coordinates.
  group: business-cockpit-process-engine-api-adapter-publish
  cancel-in-progress: false
permissions:
  contents: read
  # what 'actions/deploy-pages' in the 'deploy-coverage-report' job needs: 'pages: write'
  # to publish the page, and 'id-token: write' for the token it exchanges with the Pages
  # service. That job names no permissions of its own, so it gets these. The 'publish'
  # job does name its own, which replace these for it - it only uploads the reports as an
  # artifact, and that needs neither.
  pages: write
  id-token: write
jobs:
  publish:
    if: "${{ vars.VANILLABP_PUBLISH == 'true' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # writes the snapshots to GitHub Packages of this repository and reads those of the
      # other repositories. A pull request from a fork gets a token which can only read,
      # whatever this line says
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # a release bundle with them: "Bundle has content that does NOT have a .pom file". The
      # runner image ships 3.10 now, so this job brings its own 3.9, like the release does.
      # Remove this step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          # Into a file and not through a pipe: a transfer which breaks halfway has already
          # written to tar, so a repeat of curl could not mend it. Nine repeats wait about
          # eight minutes, long enough for a 429 of Central to pass.
          curl -fsSL --retry 9 --retry-all-errors --retry-max-time 600 --connect-timeout 20 --max-time 120 \
            -o "$RUNNER_TEMP/apache-maven.tar.gz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          tar xzf "$RUNNER_TEMP/apache-maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
      - name: Publish package
        # the profile 'publish-snapshots' sends the snapshot to GitHub Packages of this
        # repository and to the snapshot repository of Maven Central
        run: mvn -s .github/maven/settings.xml --batch-mode --no-transfer-progress --update-snapshots deploy -P publish-snapshots
        env:
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      # The reports are already there: the step above runs the whole lifecycle up to
      # 'deploy', and JaCoCo writes both of them in 'verify'. So this step only copies them
      # under the names they get on the web. A name is the last part of the address the
      # badge in README.md reads, and it follows the sibling repositories, which measure
      # each platform on its own and call the two reports 'spring-boot-report' and
      # 'quarkus-report'.
      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          cp -r test-coverage-report/spring-boot/report coverage/spring-boot-report
          cp -r test-coverage-report/quarkus/report coverage/quarkus-report
      - name: Upload coverage report files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
  # A job of its own, because the deployment runs in the environment 'github-pages' and
  # the job which builds the artifact must not. It waits for 'publish' and takes the
  # artifact that job uploaded.
  deploy-coverage-report:
    # This workflow starts on a push to main only, so the condition is true for every run
    # it has today. It is here for the day somebody adds a trigger: a page built from
    # another branch would overwrite the report of main.
    if: "${{ github.ref_name == github.event.repository.default_branch }}"
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
